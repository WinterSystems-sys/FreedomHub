<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub V4.4</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1035 0%, #0d0614 60%, #05020a 100%);
      background-attachment: fixed;
      color: #fff;
      padding-bottom: 70px;
    }
    header {
      background: rgba(20, 10, 35, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      color: #a78bfa;
    }
    .page { padding: 20px; }
    .hidden { display: none !important; }
    .card {
      background: rgba(30, 20, 50, 0.7);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    input, textarea, button, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-sizing: border-box;
      background-color: #160d26;
      color: #fff;
    }
    button {
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    .btn-google { background: #ea4335; }
    .btn-secondary { background: #334155; }
    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: 8px;
      margin-top: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumbnail-img { width: 100%; height: 100%; object-fit: cover; }
    .play-overlay {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(126, 34, 206, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* --- V4.4 Shorts Layout (Snap Stream) --- */
    .shorts-page {
      padding: 0 !important;
    }
    #shortsContainer {
      height: calc(100vh - 120px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }
    .short-card {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .short-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .short-overlay {
      position: absolute;
      bottom: 30px;
      left: 15px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .short-actions {
      position: absolute;
      right: 15px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }
    .short-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 8, 25, 0.95);
      display: flex;
      justify-content: space-evenly;
      padding: 12px 0;
      border-top: 1px solid rgba(168, 85, 247, 0.3);
      z-index: 9999;
    }
    nav button { width: auto; margin: 0; background: transparent; color: #a78bfa; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const CLOUD_NAME = "Ee4kulds";
    const UPLOAD_PRESET = "nzhyyeps";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let cachedPosts = [];

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainNavigation').classList.remove('hidden');
        showPage('home');
        await loadProfileData();
        await loadFeed();
      } else {
        currentUser = null;
        document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('mainNavigation').classList.add('hidden');
      }
    });

    window.handleEmailAuth = async function(type) {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!email || !password) return alert('Enter email & password');
      try {
        if (type === 'register') {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "profiles", res.user.uid), { username: email.split('@')[0], bio: '', avatarUrl: '' });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) { alert(err.message); }
    };

    window.handleGoogleSignIn = async function() {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        const userRef = doc(db, "profiles", res.user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { username: res.user.displayName || 'User', bio: '', avatarUrl: res.user.photoURL || '' });
        }
      } catch (err) { alert(err.message); }
    };

    window.handleLogout = async function() { await signOut(auth); };

    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
      if (pageId === 'shorts') renderShorts();
    };

    async function uploadToCloudinary(file, resourceType = 'auto') {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, { method: 'POST', body: formData });
      const data = await response.json();
      return data.secure_url;
    }

    window.uploadVideo = async function() {
      if (!currentUser) return;
      const fileInput = document.getElementById('videoFileInput');
      const thumbInput = document.getElementById('thumbFileInput');
      const titleInput = document.getElementById('videoTitle');
      const descInput = document.getElementById('videoDesc');

      if (!fileInput.files[0]) return alert('Select video file.');

      const userSnap = await getDoc(doc(db, "profiles", currentUser.uid));
      const creatorName = userSnap.exists() ? (userSnap.data().username || 'Anonymous') : 'Anonymous';

      alert('Publishing video...');
      try {
        const videoUrl = await uploadToCloudinary(fileInput.files[0], 'video');
        let thumbnailUrl = thumbInput.files[0] ? await uploadToCloudinary(thumbInput.files[0], 'image') : '';

        await addDoc(collection(db, "posts"), {
          title: titleInput.value.trim() || 'Untitled',
          description: descInput.value.trim() || '',
          creator: creatorName,
          videoUrl,
          thumbnailUrl,
          likes: 0,
          views: 0,
          createdAt: new Date()
        });

        alert('Video live!');
        fileInput.value = ''; thumbInput.value = ''; titleInput.value = ''; descInput.value = '';
        await loadFeed();
        showPage('home');
      } catch (err) { alert(err.message); }
    };

    window.playInlineVideo = async function(containerId, videoUrl, postId) {
      document.getElementById(containerId).innerHTML = `<video src="${videoUrl}" controls autoplay style="width:100%; border-radius: 8px;"></video>`;
      try { await updateDoc(doc(db, "posts", postId), { views: increment(1) }); } catch (err) {}
    };

    async function loadFeed() {
      const container = document.getElementById('feed');
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        container.innerHTML = '';
        cachedPosts = [];
        
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          cachedPosts.push({ id, ...data });

          const mediaContainerId = `media-${id}`;
          let mediaHtml = data.thumbnailUrl ? `
            <div id="${mediaContainerId}" class="thumbnail-container" onclick="playInlineVideo('${mediaContainerId}', '${data.videoUrl}', '${id}')">
              <img src="${data.thumbnailUrl}" class="thumbnail-img">
              <div class="play-overlay">▶</div>
            </div>` : `
            <div id="${mediaContainerId}">
              <video src="${data.videoUrl}" controls style="width:100%; border-radius: 8px; margin-top:8px;"></video>
            </div>`;

          const post = document.createElement('div');
          post.className = 'card';
          post.innerHTML = `
            <h3>${data.title || 'Untitled'}</h3>
            <span style="color:#a78bfa;">By @${data.creator || 'Anonymous'}</span>
            ${mediaHtml}
            <p style="font-size:13px; color:#a78bfa;">${data.description || ''}</p>
          `;
          container.appendChild(post);
        });
      } catch (err) {}
    }

    function renderShorts() {
      const container = document.getElementById('shortsContainer');
      if (!cachedPosts.length) {
        container.innerHTML = '<p style="text-align:center; padding-top:40px;">No videos available.</p>';
        return;
      }

      container.innerHTML = cachedPosts.map(post => `
        <div class="short-card">
          <video src="${post.videoUrl}" controls loop playsinline></video>
          <div class="short-overlay">
            <h4 style="margin:0 0 4px 0; font-size:16px;">${post.title || 'Untitled'}</h4>
            <span style="font-size:13px; color:#38bdf8;">@${post.creator || 'Anonymous'}</span>
            <p style="font-size:12px; margin:4px 0 0 0; color:#ddd;">${post.description || ''}</p>
          </div>
          <div class="short-actions">
            <button class="short-btn" onclick="likeShort('${post.id}')">❤️</button>
            <span style="font-size:11px;">${post.likes || 0}</span>
          </div>
        </div>
      `).join('');
    }

    window.likeShort = async function(postId) {
      try {
        await updateDoc(doc(db, "posts", postId), { likes: increment(1) });
        const post = cachedPosts.find(p => p.id === postId);
        if (post) post.likes = (post.likes || 0) + 1;
        renderShorts();
      } catch (err) {}
    };

    async function loadProfileData() {
      if (!currentUser) return;
      try {
        const docSnap = await getDoc(doc(db, "profiles", currentUser.uid));
        if (docSnap.exists()) {
          const profile = docSnap.data();
          document.getElementById('username').value = profile.username || '';
          document.getElementById('bio').value = profile.bio || '';
        }
      } catch (err) {}
    }
  </script>
</head>
<body>

  <header>FreedomHub V4.4</header>

  <div id="authScreen" class="page">
    <div class="card">
      <h2>Sign In</h2>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <button onclick="handleEmailAuth('login')">Sign In</button>
      <button onclick="handleEmailAuth('register')" class="btn-secondary">Register</button>
      <button onclick="handleGoogleSignIn()" class="btn-google">Google Sign In</button>
    </div>
  </div>

  <div id="home" class="page hidden">
    <div id="feed"></div>
  </div>

  <div id="shorts" class="page shorts-page hidden">
    <div id="shortsContainer"></div>
  </div>

  <div id="upload" class="page hidden">
    <div class="card">
      <h2>Upload Video</h2>
      <input type="file" id="videoFileInput" accept="video/*">
      <input type="file" id="thumbFileInput" accept="image/*">
      <input type="text" id="videoTitle" placeholder="Title">
      <textarea id="videoDesc" placeholder="Description"></textarea>
      <button onclick="uploadVideo()">Publish</button>
    </div>
  </div>

  <div id="profile" class="page hidden">
    <div class="card">
      <input type="text" id="username" placeholder="Username">
      <textarea id="bio" placeholder="Bio"></textarea>
      <button onclick="handleLogout()" class="btn-secondary" style="background:#ef4444;">Log Out</button>
    </div>
  </div>

  <nav id="mainNavigation" class="hidden">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('shorts')">Shorts</button>
    <button onclick="showPage('upload')">Upload</button>
    <button onclick="showPage('profile')">Profile</button>
  </nav>

</body>
</html>
