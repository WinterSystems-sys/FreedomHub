<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 60px;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    .page {
      padding: 20px;
    }
    .hidden {
      display: none !important;
    }
    .center {
      text-align: center;
    }
    .card {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      box-sizing: border-box;
      background-color: #2b2b2b;
      color: #fff;
    }
    button {
      background-color: #007bff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #007bff;
      background-size: cover;
      background-position: center;
      margin: 0 auto 15px auto;
      border: 3px solid #ffffff;
    }
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #1f1f1f;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #333;
    }
    nav button {
      width: auto;
      margin: 0;
      background: transparent;
    }
  </style>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    // INITIALIZE FIREBASE
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // GLOBAL UTILITIES
    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    };

    // CLOUD PROFILE SAVE
    window.saveProfile = async function() {
      const username = document.getElementById('username').value;
      const bio = document.getElementById('bio').value;
      const avatarUrl = document.getElementById('avatarUrl').value;

      try {
        await setDoc(doc(db, "profiles", "myUser"), {
          username: username,
          bio: bio,
          avatarUrl: avatarUrl
        });
        if (avatarUrl) {
          document.querySelector('.profile-avatar').style.backgroundImage = `url(${avatarUrl})`;
        }
        alert('Profile saved to Google Cloud!');
      } catch (err) {
        console.error(err);
        alert('Error saving profile: ' + err.message);
      }
    };

    // CLOUD VIDEO POST (VIA URL)
    window.uploadVideo = async function() {
      const videoUrl = document.getElementById('videoUrlInput').value;
      const titleInput = document.getElementById('videoTitle').value;

      if (!videoUrl) {
        alert('Please paste a video URL.');
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          title: titleInput || 'Untitled Video',
          videoUrl: videoUrl,
          createdAt: new Date()
        });

        alert('Video link published live!');
        document.getElementById('videoUrlInput').value = '';
        document.getElementById('videoTitle').value = '';
        loadFeed();
        showPage('home');
      } catch (err) {
        console.error(err);
        alert('Error publishing video: ' + err.message);
      }
    };

    // FETCH LIVE FEED
    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '<p>Loading feed from server...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        if (querySnapshot.empty) {
          feed.innerHTML = '<p>No live videos yet. Share a video link!</p>';
          return;
        }

        feed.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const post = document.createElement('div');
          post.className = 'card';
          post.innerHTML = `
            <h3>${data.title}</h3>
            <video src="${data.videoUrl}" controls style="width:100%; border-radius: 5px;"></video>
          `;
          feed.appendChild(post);
        });
      } catch (err) {
        console.error(err);
        feed.innerHTML = '<p>Error loading posts.</p>';
      }
    }

    // INITIAL LOAD
    document.addEventListener('DOMContentLoaded', async function() {
      loadFeed();

      try {
        const docSnap = await getDoc(doc(db, "profiles", "myUser"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('username').value = data.username || '';
          document.getElementById('bio').value = data.bio || '';
          document.getElementById('avatarUrl').value = data.avatarUrl || '';
          if (data.avatarUrl) {
            document.querySelector('.profile-avatar').style.backgroundImage = `url(${data.avatarUrl})`;
          }
        }
      } catch (err) {
        console.log("No profile found yet.");
      }
    });
  </script>
</head>
<body>

  <header>FreedomHub</header>

  <!-- HOME PAGE -->
  <div id="home" class="page">
    <h2>Home Feed</h2>
    <div id="feed">
      <p>Loading...</p>
    </div>
  </div>

  <!-- UPLOAD PAGE -->
  <div id="upload" class="page hidden">
    <div class="card">
      <h2>Share Video Link</h2>
      <input type="url" id="videoUrlInput" placeholder="Paste Direct Video URL (.mp4)">
      <input type="text" id="videoTitle" placeholder="Video Title">
      <button onclick="uploadVideo()">Post Video</button>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profile" class="page hidden">
    <div class="profile-avatar"></div>
    
    <div class="center">
      <input type="text" id="username" placeholder="Username">
      <input type="url" id="avatarUrl" placeholder="Profile Image URL">
      <textarea id="bio" placeholder="Tell people about yourself"></textarea>
      <button onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('upload')">Upload</button>
    <button onclick="showPage('profile')">Profile</button>
  </nav>

</body>
</html>
