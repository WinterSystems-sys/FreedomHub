<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 60px;
    }
    header {
      background-color: #1f1f1f;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    .page {
      padding: 20px;
    }
    .hidden {
      display: none !important;
    }
    .center {
      text-align: center;
    }
    .card {
      background: #1f1f1f;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      box-sizing: border-box;
      background-color: #2b2b2b;
      color: #fff;
    }
    button {
      background-color: #007bff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #007bff;
      background-size: cover;
      background-position: center;
      margin: 0 auto 15px auto;
      cursor: pointer;
      border: 3px solid #ffffff;
    }
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #1f1f1f;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #333;
    }
    nav button {
      width: auto;
      margin: 0;
      background: transparent;
    }
  </style>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // CLOUDINARY CREDENTIALS
    const CLOUD_NAME = "Ee4kulds";
    const UPLOAD_PRESET = "nzhyyeps";

    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    // INITIALIZE FIREBASE
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // PAGE NAVIGATION
    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    };

    window.pickAvatar = function() {
      document.getElementById('avatarUpload').click();
    };

    // CLOUDINARY HELPER FUNCTION
    async function uploadToCloudinary(file, resourceType = 'auto') {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error('Cloudinary upload failed');
      }

      const data = await response.json();
      return data.secure_url;
    }

    // HANDLE AVATAR UPLOAD FROM PHONE
    window.handleAvatarSelect = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      alert('Uploading avatar to Cloudinary...');

      try {
        const imageUrl = await uploadToCloudinary(file, 'image');
        document.querySelector('.profile-avatar').style.backgroundImage = `url(${imageUrl})`;
        localStorage.setItem('savedAvatarUrl', imageUrl);
        alert('Avatar uploaded successfully!');
      } catch (err) {
        console.error(err);
        alert('Error uploading avatar: ' + err.message);
      }
    };

    // SAVE PROFILE TO FIRESTORE
    window.saveProfile = async function() {
      const username = document.getElementById('username').value;
      const bio = document.getElementById('bio').value;
      const avatarUrl = localStorage.getItem('savedAvatarUrl') || '';

      try {
        await setDoc(doc(db, "profiles", "myUser"), {
          username: username,
          bio: bio,
          avatarUrl: avatarUrl
        });
        alert('Profile saved globally!');
      } catch (err) {
        console.error(err);
        alert('Error saving profile: ' + err.message);
      }
    };

    // UPLOAD VIDEO FILE FROM PHONE TO CLOUDINARY & SAVE TO FEED
    window.uploadVideo = async function() {
      const fileInput = document.getElementById('videoFileInput');
      const titleInput = document.getElementById('videoTitle');

      if (!fileInput.files[0]) {
        alert('Please select a video file from your phone.');
        return;
      }

      const file = fileInput.files[0];
      alert('Uploading video to cloud... This may take a moment depending on file size.');

      try {
        const videoUrl = await uploadToCloudinary(file, 'video');

        await addDoc(collection(db, "posts"), {
          title: titleInput.value || 'Untitled Video',
          videoUrl: videoUrl,
          createdAt: new Date()
        });

        alert('Video published live!');
        fileInput.value = '';
        titleInput.value = '';
        loadFeed();
        showPage('home');
      } catch (err) {
        console.error(err);
        alert('Error publishing video: ' + err.message);
      }
    };

    // FETCH LIVE FEED
    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '<p>Loading feed from server...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        if (querySnapshot.empty) {
          feed.innerHTML = '<p>No live videos yet. Upload one!</p>';
          return;
        }

        feed.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const post = document.createElement('div');
          post.className = 'card';
          post.innerHTML = `
            <h3>${data.title}</h3>
            <video src="${data.videoUrl}" controls style="width:100%; border-radius: 5px;"></video>
          `;
          feed.appendChild(post);
        });
      } catch (err) {
        console.error(err);
        feed.innerHTML = '<p>Error loading posts.</p>';
      }
    }

    // INITIAL LOAD
    document.addEventListener('DOMContentLoaded', async function() {
      loadFeed();

      try {
        const docSnap = await getDoc(doc(db, "profiles", "myUser"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('username').value = data.username || '';
          document.getElementById('bio').value = data.bio || '';
          if (data.avatarUrl) {
            document.querySelector('.profile-avatar').style.backgroundImage = `url(${data.avatarUrl})`;
            localStorage.setItem('savedAvatarUrl', data.avatarUrl);
          }
        }
      } catch (err) {
        console.log("No profile found yet.");
      }
    });
  </script>
</head>
<body>

  <header>FreedomHub</header>

  <!-- HOME PAGE -->
  <div id="home" class="page">
    <h2>Home Feed</h2>
    <div id="feed">
      <p>Loading...</p>
    </div>
  </div>

  <!-- UPLOAD PAGE -->
  <div id="upload" class="page hidden">
    <div class="card">
      <h2>Upload Video File</h2>
      <input type="file" id="videoFileInput" accept="video/*">
      <input type="text" id="videoTitle" placeholder="Video Title">
      <button onclick="uploadVideo()">Post Video</button>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profile" class="page hidden">
    <div class="profile-avatar" onclick="pickAvatar()"></div>
    <p class="center" style="font-size: 12px; color: #888;">Tap circle to change photo</p>
    
    <div class="center">
      <input type="text" id="username" placeholder="Username">
      <textarea id="bio" placeholder="Tell people about yourself"></textarea>
      <button onclick="saveProfile()">Save Profile</button>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('upload')">Upload</button>
    <button onclick="showPage('profile')">Profile</button>
  </nav>

  <!-- HIDDEN FILE INPUT FOR AVATAR -->
  <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="handleAvatarSelect(event)">

</body>
</html>
