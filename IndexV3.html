<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1035 0%, #0d0614 60%, #05020a 100%);
      --header-bg: rgba(20, 10, 35, 0.85);
      --card-bg: rgba(30, 20, 50, 0.7);
      --text-color: #ffffff;
      --subtext-color: #a78bfa;
      --border-color: rgba(168, 85, 247, 0.3);
      --input-bg: #160d26;
      --nav-bg: rgba(15, 8, 25, 0.95);
      --accent-color: #38bdf8;
    }

    body.light-mode {
      --bg-gradient: #f1f5f9;
      --header-bg: #ffffff;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #475569;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
      --nav-bg: #ffffff;
      --accent-color: #0284c7;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      padding-bottom: 75px;
    }
    header {
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      color: var(--subtext-color);
    }
    .page {
      padding: 20px;
    }
    .hidden {
      display: none !important;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }
    input, textarea, button, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      background-color: var(--input-bg);
      color: var(--text-color);
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: var(--subtext-color);
      font-weight: bold;
    }
    button {
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    .btn-google {
      background: #ea4335;
    }
    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #3b82f6;
      background-size: cover;
      background-position: center;
      margin: 0 auto 10px auto;
      cursor: pointer;
      border: 3px solid #a855f7;
    }
    .creator-link {
      color: var(--accent-color);
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      margin-top: 4px;
      font-size: 14px;
    }
    .action-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin-top: 5px;
      display: inline-block;
    }
    .comment-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .comment-item {
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 5px;
    }
    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: 8px;
      margin-top: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(126, 34, 206, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }
    .meta-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      color: var(--subtext-color);
      margin-top: 8px;
    }
    .badge {
      background: rgba(168, 85, 247, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--accent-color);
    }
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-top: 10px;
    }
    .category-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-color);
    }
    .category-chip.active {
      background: #7e22ce;
      color: #fff;
    }
    #shortsContainer {
      height: calc(100vh - 140px);
      overflow-y: mandatory;
      scroll-snap-type: y mandatory;
    }
    .short-card {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .short-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .short-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 70px;
      z-index: 10;
    }
    .short-actions {
      position: absolute;
      right: 15px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }
    .short-btn {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--nav-bg);
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--border-color);
      z-index: 9999;
    }
    nav button {
      width: auto;
      margin: 0;
      padding: 4px 10px;
      background: transparent;
      color: var(--subtext-color);
      font-size: 13px;
    }
    .timestamp-link {
      color: #38bdf8;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const CLOUD_NAME = "Ee4kulds";
    const UPLOAD_PRESET = "nzhyyeps";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let currentUserProfile = { following: [] };
    let allPostsData = [];
    let activeCategory = 'All';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainNavigation').classList.remove('hidden');
        showPage('home');
        await loadProfileData();
        await loadFeed();
      } else {
        currentUser = null;
        document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('mainNavigation').classList.add('hidden');
      }
    });

    window.toggleTheme = function() {
      document.body.classList.toggle('light-mode');
    };

    window.handleEmailAuth = async function(type) {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!email || !password) return alert('Enter email & password');

      try {
        if (type === 'register') {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "profiles", res.user.uid), { username: email.split('@')[0], bio: '', avatarUrl: '', following: [] });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) { alert(err.message); }
    };

    window.handleGoogleSignIn = async function() {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        const userRef = doc(db, "profiles", res.user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { username: res.user.displayName || 'User', bio: '', avatarUrl: res.user.photoURL || '', following: [] });
        }
      } catch (err) { alert(err.message); }
    };

    window.handleLogout = async function() { await signOut(auth); };

    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
      if (pageId === 'subs') loadSubsFeed();
      if (pageId === 'shorts') loadShortsFeed();
    };

    window.pickAvatar = function() { document.getElementById('avatarUpload').click(); };

    async function uploadToCloudinary(file, resourceType = 'auto') {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    window.handleAvatarSelect = async function(event) {
      const file = event.target.files[0];
      if (!file || !currentUser) return;
      alert('Uploading avatar...');
      try {
        const imageUrl = await uploadToCloudinary(file, 'image');
        document.querySelector('.profile-avatar').style.backgroundImage = `url(${imageUrl})`;
        await setDoc(doc(db, "profiles", currentUser.uid), { avatarUrl: imageUrl }, { merge: true });
        alert('Avatar updated!');
      } catch (err) { alert(err.message); }
    };

    window.saveProfile = async function() {
      if (!currentUser) return;
      const username = document.getElementById('username').value.trim() || 'Anonymous';
      const bio = document.getElementById('bio').value;
      try {
        await setDoc(doc(db, "profiles", currentUser.uid), { username, bio }, { merge: true });
        alert('Profile saved!');
      } catch (err) { alert(err.message); }
    };

    window.uploadVideo = async function() {
      if (!currentUser) return;
      const fileInput = document.getElementById('videoFileInput');
      const thumbInput = document.getElementById('thumbFileInput');
      const titleInput = document.getElementById('videoTitle');
      const descInput = document.getElementById('videoDesc');
      const categorySelect = document.getElementById('videoCategory');

      if (!fileInput.files[0]) return alert('Select video file.');

      const userSnap = await getDoc(doc(db, "profiles", currentUser.uid));
      const creatorName = userSnap.exists() ? (userSnap.data().username || 'Anonymous') : 'Anonymous';

      alert('Publishing video...');
      try {
        const videoUrl = await uploadToCloudinary(fileInput.files[0], 'video');
        let thumbnailUrl = thumbInput.files[0] ? await uploadToCloudinary(thumbInput.files[0], 'image') : '';

        await addDoc(collection(db, "posts"), {
          title: titleInput.value.trim() || 'Untitled',
          description: descInput.value.trim() || '',
          category: categorySelect.value || 'General',
          creator: creatorName,
          creatorUid: currentUser.uid,
          videoUrl,
          thumbnailUrl,
          likes: 0,
          dislikes: 0,
          views: 0,
          comments: [],
          createdAt: new Date()
        });

        alert('Video live!');
        fileInput.value = ''; thumbInput.value = ''; titleInput.value = ''; descInput.value = '';
        await loadFeed();
        showPage('home');
      } catch (err) { alert(err.message); }
    };

    function parseTimestamps(text, videoId) {
      if (!text) return '';
      return text.replace(/\b(\d{1,2}):(\d{2})\b/g, (match, m, s) => {
        const totalSec = parseInt(m, 10) * 60 + parseInt(s, 10);
        return `<span class="timestamp-link" onclick="seekVideo('${videoId}', ${totalSec})">${match}</span>`;
      });
    }

    window.seekVideo = function(videoId, seconds) {
      const videoEl = document.querySelector(`#media-${videoId} video`);
      if (videoEl) {
        videoEl.currentTime = seconds;
        videoEl.play();
      }
    };

    window.playInlineVideo = async function(containerId, videoUrl, postId) {
      document.getElementById(containerId).innerHTML = `<video src="${videoUrl}" controls autoplay style="width:100%; border-radius: 8px;"></video>`;
      registerDirectPlayView(postId);
    };

    window.registerDirectPlayView = async function(postId) {
      try { await updateDoc(doc(db, "posts", postId), { views: increment(1) }); } catch (err) {}
    };

    window.likePost = async function(postId) {
      try { await updateDoc(doc(db, "posts", postId), { likes: increment(1) }); loadFeed(); } catch (err) {}
    };

    window.dislikePost = async function(postId) {
      try { await updateDoc(doc(db, "posts", postId), { dislikes: increment(1) }); loadFeed(); } catch (err) {}
    };

    window.addComment = async function(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input.value.trim()) return;
      try {
        await updateDoc(doc(db, "posts", postId), { comments: arrayUnion(input.value.trim()) });
        input.value = '';
        loadFeed();
      } catch (err) {}
    };

    window.setCategory = function(cat) {
      activeCategory = cat;
      document.querySelectorAll('.category-chip').forEach(chip => chip.classList.toggle('active', chip.innerText === cat));
      filterFeed();
    };

    window.filterFeed = function() {
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filtered = allPostsData.filter(item => {
        const matchesCategory = (activeCategory === 'All' || (item.data.category || 'General') === activeCategory);
        const matchesSearch = (item.data.title || '').toLowerCase().includes(query) || (item.data.creator || '').toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      renderFeedItems(filtered, 'feed');
    };

    function renderFeedItems(posts, targetContainerId = 'feed') {
      const container = document.getElementById(targetContainerId);
      if (posts.length === 0) {
        container.innerHTML = '<p>No videos found.</p>';
        return;
      }

      container.innerHTML = '';
      posts.forEach((item) => {
        const data = item.data;
        const id = item.id;
        const parsedDesc = parseTimestamps(data.description || '', id);
        const commentsList = data.comments ? data.comments.map(c => `<div class="comment-item">${parseTimestamps(c, id)}</div>`).join('') : '';
        const mediaContainerId = `media-${id}`;

        let mediaHtml = data.thumbnailUrl ? `
          <div id="${mediaContainerId}" class="thumbnail-container" onclick="playInlineVideo('${mediaContainerId}', '${data.videoUrl}', '${id}')">
            <img src="${data.thumbnailUrl}" class="thumbnail-img" alt="Thumbnail">
            <div class="play-overlay">▶</div>
          </div>` : `
          <div id="${mediaContainerId}">
            <video src="${data.videoUrl}" controls style="width:100%; border-radius: 8px; margin-top:8px;" onplay="registerDirectPlayView('${id}')"></video>
          </div>`;

        const post = document.createElement('div');
        post.className = 'card';
        post.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <h3 style="margin:0;">${data.title || 'Untitled'}</h3>
            <span class="badge">${data.category || 'General'}</span>
          </div>
          <span class="creator-link" onclick="openChannel('${data.creator}')">By @${data.creator || 'Anonymous'}</span>
          ${mediaHtml}
          <p style="font-size:13px; margin:8px 0; color:var(--subtext-color);">${parsedDesc}</p>
          <div class="meta-bar">
            <span>👁️ ${data.views || 0} views</span>
            <button class="action-btn" onclick="likePost('${id}')">❤️ ${data.likes || 0}</button>
            <button class="action-btn btn-secondary" onclick="dislikePost('${id}')">👎 ${data.dislikes || 0}</button>
          </div>
          <div class="comment-box">
            <input type="text" id="comment-input-${id}" placeholder="Comment (e.g. 0:15 level!)">
            <button class="action-btn" onclick="addComment('${id}')">Post</button>
            <div style="margin-top:10px;">${commentsList}</div>
          </div>
        `;
        container.appendChild(post);
      });
    }

    function loadShortsFeed() {
      const container = document.getElementById('shortsContainer');
      container.innerHTML = allPostsData.length === 0 ? '<p>No shorts available.</p>' : allPostsData.map(item => `
        <div class="short-card">
          <video src="${item.data.videoUrl}" controls loop onplay="registerDirectPlayView('${item.id}')"></video>
          <div class="short-overlay">
            <h4 style="margin:0; font-size:16px;">${item.data.title || 'Untitled'}</h4>
            <span style="font-size:13px; color:#38bdf8;">@${item.data.creator || 'Anonymous'}</span>
          </div>
          <div class="short-actions">
            <button class="short-btn" onclick="likePost('${item.id}')">❤️</button>
            <span style="font-size:11px;">${item.data.likes || 0}</span>
            <button class="short-btn" onclick="dislikePost('${item.id}')">👎</button>
            <span style="font-size:11px;">${item.data.dislikes || 0}</span>
          </div>
        </div>
      `).join('');
    }

    function loadSubsFeed() {
      const followedCreators = currentUserProfile.following || [];
      const followedPosts = allPostsData.filter(item => followedCreators.includes((item.data.creator || '').toLowerCase()));
      renderFeedItems(followedPosts, 'subsFeed');
    }

    async function loadFeed() {
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        allPostsData = [];
        querySnapshot.forEach(docSnap => allPostsData.push({ id: docSnap.id, data: docSnap.data() }));
        filterFeed();
      } catch (err) {}
    }

    async function loadProfileData() {
      if (!currentUser) return;
      try {
        const docSnap = await getDoc(doc(db, "profiles", currentUser.uid));
        if (docSnap.exists()) {
          currentUserProfile = docSnap.data();
          document.getElementById('username').value = currentUserProfile.username || '';
          document.getElementById('bio').value = currentUserProfile.bio || '';
