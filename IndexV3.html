<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1035 0%, #0d0614 60%, #05020a 100%);
      background-attachment: fixed;
      color: #ffffff;
      padding-bottom: 70px;
    }
    header {
      background: rgba(20, 10, 35, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
      color: #d8b4fe;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }
    .page {
      padding: 20px;
    }
    .hidden {
      display: none !important;
    }
    .center {
      text-align: center;
    }
    .card {
      background: rgba(30, 20, 50, 0.7);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-sizing: border-box;
      background-color: #160d26;
      color: #fff;
    }
    button {
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      cursor: pointer;
      font-weight: bold;
      border: none;
      transition: transform 0.1s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #3b82f6;
      background-size: cover;
      background-position: center;
      margin: 0 auto 10px auto;
      cursor: pointer;
      border: 3px solid #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }
    .creator-link {
      color: #38bdf8;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      margin-top: 4px;
      font-size: 14px;
    }
    .stats-container {
      display: flex;
      justify-content: space-around;
      background: rgba(20, 10, 35, 0.6);
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }
    .stat-box {
      text-align: center;
    }
    .stat-num {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 11px;
      color: #a78bfa;
      text-transform: uppercase;
    }
    .action-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin-top: 5px;
      display: inline-block;
    }
    .comment-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .comment-item {
      font-size: 13px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 5px;
    }
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(15, 8, 25, 0.95);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid rgba(168, 85, 247, 0.3);
    }
    nav button {
      width: auto;
      margin: 0;
      background: transparent;
      color: #a78bfa;
    }
  </style>

  <!-- FIREBASE SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const CLOUD_NAME = "Ee4kulds";
    const UPLOAD_PRESET = "nzhyyeps";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPostsData = [];

    function getUserId() {
      let uid = localStorage.getItem('fh_user_id');
      if (!uid) {
        uid = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('fh_user_id', uid);
      }
      return uid;
    }

    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    };

    window.pickAvatar = function() {
      document.getElementById('avatarUpload').click();
    };

    async function uploadToCloudinary(file, resourceType = 'auto') {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    window.handleAvatarSelect = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      alert('Uploading avatar...');

      try {
        const imageUrl = await uploadToCloudinary(file, 'image');
        document.querySelector('.profile-avatar').style.backgroundImage = `url(${imageUrl})`;
        localStorage.setItem('savedAvatarUrl', imageUrl);
        alert('Avatar updated!');
      } catch (err) {
        alert('Error uploading avatar: ' + err.message);
      }
    };

    window.saveProfile = async function() {
      const usernameInput = document.getElementById('username').value.trim();
      const username = usernameInput || 'Anonymous';
      const bio = document.getElementById('bio').value;
      const avatarUrl = localStorage.getItem('savedAvatarUrl') || '';
      const uid = getUserId();

      try {
        await setDoc(doc(db, "profiles", uid), {
          username: username,
          bio: bio,
          avatarUrl: avatarUrl
        }, { merge: true });
        localStorage.setItem('currentUsername', username);
        alert('Profile saved globally!');
      } catch (err) {
        alert('Error saving profile: ' + err.message);
      }
    };

    // RETROACTIVE FIX: Updates older posts missing creator info
    window.claimAnonymousPosts = async function() {
      const currentUsername = document.getElementById('username').value.trim();
      if (!currentUsername || currentUsername === 'Anonymous') {
        alert('Please enter and save a custom Username on your Profile first!');
        return;
      }

      alert('Scanning for unassigned videos to claim...');

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        let updatedCount = 0;

        for (const docSnap of querySnapshot.docs) {
          const post = docSnap.data();
          if (!post.creator || post.creator === 'Anonymous') {
            await updateDoc(doc(db, "posts", docSnap.id), {
              creator: currentUsername
            });
            updatedCount++;
          }
        }

        alert(`Success! Updated ${updatedCount} video(s) to @${currentUsername}.`);
        loadFeed();
      } catch (err) {
        alert('Error updating old videos: ' + err.message);
      }
    };

    window.uploadVideo = async function() {
      const fileInput = document.getElementById('videoFileInput');
      const titleInput = document.getElementById('videoTitle');
      
      let creatorName = localStorage.getItem('currentUsername') || document.getElementById('username').value.trim();
      
      if (!creatorName || creatorName === 'Anonymous') {
        const promptedName = prompt("Please enter your in-app Username for FreedomHub:", "Creator1");
        if (promptedName && promptedName.trim()) {
          creatorName = promptedName.trim();
          document.getElementById('username').value = creatorName;
          saveProfile();
        } else {
          creatorName = 'Anonymous';
        }
      }

      if (!fileInput.files[0]) {
        alert('Please select or record a video file.');
        return;
      }

      const file = fileInput.files[0];
      alert('Uploading video to space cloud...');

      try {
        const videoUrl = await uploadToCloudinary(file, 'video');

        await addDoc(collection(db, "posts"), {
          title: titleInput.value.trim() || 'Untitled Video',
          creator: creatorName,
          videoUrl: videoUrl,
          likes: 0,
          comments: [],
          createdAt: new Date()
        });

        alert('Video published live!');
        fileInput.value = '';
        titleInput.value = '';
        await loadFeed();
        await loadProfileData();
        showPage('home');
      } catch (err) {
        alert('Error publishing video: ' + err.message);
      }
    };

    window.likePost = async function(postId) {
      try {
        const postRef = doc(db, "posts", postId);
        await updateDoc(postRef, {
          likes: increment(1)
        });
        loadFeed();
        loadProfileData();
      } catch (err) {
        console.error(err);
      }
    };

    window.addComment = async function(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input.value.trim()) return;

      try {
        const postRef = doc(db, "posts", postId);
        await updateDoc(postRef, {
          comments: arrayUnion(input.value.trim())
        });
        input.value = '';
        loadFeed();
      } catch (err) {
        console.error(err);
      }
    };

    window.openChannel = function(creatorName) {
      const currentLocalUser = localStorage.getItem('currentUsername') || 'Anonymous';
      
      if (creatorName.toLowerCase() === currentLocalUser.toLowerCase() && creatorName !== 'Anonymous') {
        showPage('profile');
        return;
      }

      document.getElementById('channelName').innerText = `@${creatorName}`;
      
      const channelVideos = allPostsData.filter(p => {
        const c = p.data.creator || 'Anonymous';
        return c.toLowerCase() === creatorName.toLowerCase();
      });
      
      const container = document.getElementById('channelVideosContainer');
      
      if (channelVideos.length === 0) {
        container.innerHTML = '<p style="font-size:13px; color:#aaa;">No public videos found for this creator.</p>';
      } else {
        container.innerHTML = channelVideos.map(v => {
          const vTitle = v.data.title || 'Untitled Video';
          return `
            <div style="margin-top:10px; background:rgba(0,0,0,0.3); padding:8px; border-radius:6px;">
              <p style="font-size:13px; margin:0 0 5px 0;"><strong>${vTitle}</strong></p>
              <video src="${v.data.videoUrl}" controls style="width:100%; border-radius:4px;"></video>
            </div>
          `;
        }).join('');
      }

      showPage('channelOverlay');
    };

    function renderFeedItems(posts) {
      const feed = document.getElementById('feed');
      if (posts.length === 0) {
        feed.innerHTML = '<p>No matching videos or creators found.</p>';
        return;
      }

      feed.innerHTML = '';
      posts.forEach((item) => {
        const data = item.data;
        const id = item.id;
        const videoTitle = data.title || 'Untitled Video';
        const creator = data.creator || 'Anonymous';
        const commentsList = data.comments ? data.comments.map(c => `<div class="comment-item">${c}</div>`).join('') : '';

        const post = document.createElement('div');
        post.className = 'card';
        post.innerHTML = `
          <h3 style="margin-bottom:2px;">${videoTitle}</h3>
          <span class="creator-link" onclick="openChannel('${creator}')">By @${creator}</span>
          <video src="${data.videoUrl}" controls style="width:100%; border-radius: 8px; margin-top:8px;"></video>
          <div style="margin-top:8px;">
            <button class="action-btn" onclick="likePost('${id}')">❤️ Like (${data.likes || 0})</button>
          </div>
          <div class="comment-box">
            <input type="text" id="comment-input-${id}" placeholder="Add a comment...">
            <button class="action-btn" onclick="addComment('${id}')">Post Comment</button>
            <div style="margin-top:10px;">${commentsList}</div>
          </div>
        `;
        feed.appendChild(post);
      });
    }

    window.filterFeed = function() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderFeedItems(allPostsData);
        return;
      }

      const filtered = allPostsData.filter(item => {
        const titleMatch = (item.data.title || 'Untitled Video').toLowerCase().includes(query);
        const creatorMatch = (item.data.creator || 'Anonymous').toLowerCase().includes(query);
        return titleMatch || creatorMatch;
      });

      renderFeedItems(filtered);
    };

    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '<p>Loading galaxy stream...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        if (querySnapshot.empty) {
          feed.innerHTML = '<p>No live videos yet. Launch one!</p>';
          return;
        }

        allPostsData = [];
        querySnapshot.forEach((docSnap) => {
          allPostsData.push({ id: docSnap.id, data: docSnap.data() });
        });

        renderFeedItems(allPostsData);
      } catch (err) {
        feed.innerHTML = '<p>Error loading posts.</p>';
      }
    }

    async function loadProfileData() {
      const uid = getUserId();
      try {
        const docSnap = await getDoc(doc(db, "profiles", uid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          const username = data.username || '';
          document.getElementById('username').value = username;
          document.getElementById('bio').value = data.bio || '';
          document.getElementById('stat-followers').innerText = data.followersCount || 0;
          document.getElementById('stat-following').innerText = data.followingCount || 0;
          if (username) localStorage.setItem('currentUsername', username);

          if (data.avatarUrl) {
            document.querySelector('.profile-avatar').style.backgroundImage = `url(${data.avatarUrl})`;
            localStorage.setItem('savedAvatarUrl', data.avatarUrl);
          }
        }

        const postsSnapshot = await getDocs(collection(db, "posts"));
        let totalLikes = 0;
        let totalVideos = postsSnapshot.size;
        let topPost = null;
        let maxLikes = -1;

        postsSnapshot.forEach((docSnap) => {
          const postData = docSnap.data();
          const likesCount = postData.likes || 0;
          totalLikes += likesCount;

          if (likesCount > maxLikes) {
            maxLikes = likesCount;
            topPost = postData;
          }
        });

        document.getElementById('stat-likes').innerText = totalLikes;
        document.getElementById('stat-videos').innerText = totalVideos;

        if (topPost) {
          document.getElementById('topVideoSection').classList.remove('hidden');
          document.getElementById('topVideoTitle').innerText = `${topPost.title || 'Untitled Video'} (${maxLikes} Likes)`;
          document.getElementById('topVideoPlayer').src = topPost.videoUrl;
        }
      } catch (err) {
        console.log("Error evaluating profile data: ", err);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadFeed();
      loadProfileData();
    });
  </script>
</head>
<body>

  <header>FreedomHub</header>

  <!-- HOME FEED PAGE -->
  <div id="home" class="page">
    <h2>Galaxy Feed</h2>
    <input type="text" id="searchInput" placeholder="🔍 Search songs or creators..." onkeyup="filterFeed()">
    <div id="feed" style="margin-top: 15px;">
      <p>Loading...</p>
    </div>
  </div>

  <!-- UPLOAD PAGE -->
  <div id="upload" class="page hidden">
    <div class="card">
      <h2>Record or Upload Video</h2>
      <input type="file" id="videoFileInput" accept="video/*" capture="environment">
      <input type="text" id="videoTitle" placeholder="Video / Song Title">
      <button onclick="uploadVideo()">Launch Video</button>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profile" class="page hidden">
    <div class="profile-avatar" onclick="pickAvatar()"></div>
    <p class="center" style="font-size: 11px; color: #a78bfa;">Tap icon to change photo</p>
    
    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-num" id="stat-videos">0</div>
        <div class="stat-label">Videos</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-likes">0</div>
        <div class="stat-label">Likes</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-followers">0</div>
        <div class="stat-label">Followers</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-following">0</div>
        <div class="stat-label">Following</div>
      </div>
    </div>

    <div id="topVideoSection" class="card hidden">
      <h3 style="margin-top:0; color:#38bdf8;">🔥 Top Video</h3>
      <p id="topVideoTitle" style="font-size:14px; margin-bottom:8px;"></p>
      <video id="topVideoPlayer" controls style="width:100%; border-radius: 6px;"></video>
    </div>

    <div class="card">
      <input type="text" id="username" placeholder="In-App Username">
      <textarea id="bio" placeholder="Tell people about yourself"></textarea>
      <button onclick="saveProfile()">Save Profile</button>
      <button onclick="claimAnonymousPosts()" style="background: linear-gradient(135deg, #059669, #0284c7); margin-top: 8px;">Claim Anonymous Videos</button>
    </div>
  </div>

  <!-- CHANNEL OVERLAY PAGE -->
  <div id="channelOverlay" class="page hidden">
    <button class="action-btn" onclick="showPage('home')" style="margin-bottom:15px;">← Back to Feed</button>
    <div class="card">
      <h2 id="channelName" style="margin-top:0; color:#38bdf8;">@Creator</h2>
      <button class="action-btn">Follow</button>
    </div>
    <div class="card">
      <h3>Uploaded Videos</h3>
      <div id="channelVideosContainer"></div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('upload')">Upload</button>
    <button onclick="showPage('profile')">Profile</button>
  </nav>

  <!-- HIDDEN FILE INPUT -->
  <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="handleAvatarSelect(event)">

</body>
</html>
