<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomHub V4.5</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1035 0%, #0d0614 60%, #05020a 100%);
      background-attachment: fixed;
      color: #fff;
      padding-bottom: 70px;
    }
    header {
      background: rgba(20, 10, 35, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      color: #a78bfa;
    }
    .page { padding: 20px; }
    .hidden { display: none !important; }
    .card {
      background: rgba(30, 20, 50, 0.7);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-sizing: border-box;
      background-color: #160d26;
      color: #fff;
    }
    button {
      background: linear-gradient(135deg, #7e22ce, #3b82f6);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    .btn-google { background: #ea4335; }
    .btn-secondary { background: #334155; }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #3b82f6;
      background-size: cover;
      background-position: center;
      margin: 0 auto 15px auto;
      border: 3px solid #a855f7;
      cursor: pointer;
    }
    .creator-link {
      color: #38bdf8;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      margin-top: 4px;
    }
    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: 8px;
      margin-top: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumbnail-img { width: 100%; height: 100%; object-fit: cover; }
    .play-overlay {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(126, 34, 206, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Shorts Layout */
    .shorts-page { padding: 0 !important; }
    #shortsContainer {
      height: calc(100vh - 120px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }
    .short-card {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .short-card video { width: 100%; height: 100%; object-fit: cover; }
    .short-overlay {
      position: absolute;
      bottom: 30px;
      left: 15px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .short-actions {
      position: absolute;
      right: 15px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }
    .short-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    /* Comment Section Styling */
    .comment-item {
      background: rgba(15, 8, 25, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.2);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 13px;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 8, 25, 0.95);
      display: flex;
      justify-content: space-evenly;
      padding: 12px 0;
      border-top: 1px solid rgba(168, 85, 247, 0.3);
      z-index: 9999;
    }
    nav button { width: auto; margin: 0; background: transparent; color: #a78bfa; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const CLOUD_NAME = "Ee4kulds";
    const UPLOAD_PRESET = "nzhyyeps";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfO22_KVc-Hi5thsEyu7BBXBaMAa4luM",
      authDomain: "freedomhub-a710b.firebaseapp.com",
      projectId: "freedomhub-a710b",
      storageBucket: "freedomhub-a710b.firebasestorage.app",
      messagingSenderId: "349898855135",
      appId: "1:349898855135:web:efdc83fb3a8fd8a0f50f6a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let cachedPosts = [];
    let currentActivePost = null;

    window.showPage = function(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
      const target = document.getElementById(pageId);
      if (target) target.classList.remove('hidden');
      if (pageId === 'shorts') renderShorts();
      if (pageId === 'profile') loadProfileData();
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('mainNavigation').classList.remove('hidden');
        showPage('home');
        await loadFeed();
        await loadProfileData();
      } else {
        currentUser = null;
        document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('mainNavigation').classList.add('hidden');
      }
    });

    window.handleEmailAuth = async function(type) {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      if (!email || !password) return alert('Enter email & password');
      try {
        if (type === 'register') {
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "profiles", res.user.uid), { username: email.split('@')[0], bio: '', avatarUrl: '' });
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) { alert(err.message); }
    };

    window.handleGoogleSignIn = async function() {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        const userRef = doc(db, "profiles", res.user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { username: res.user.displayName || 'User', bio: '', avatarUrl: res.user.photoURL || '' });
        }
      } catch (err) { alert(err.message); }
    };

    window.handleLogout = async function() { await signOut(auth); };

    window.pickAvatar = function() { document.getElementById('avatarUpload').click(); };

    async function uploadToCloudinary(file, resourceType = 'auto') {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, { method: 'POST', body: formData });
      const data = await response.json();
      return data.secure_url;
    }

    window.handleAvatarSelect = async function(event) {
      const file = event.target.files[0];
      if (!file || !currentUser) return;
      alert('Uploading avatar...');
      try {
        const imageUrl = await uploadToCloudinary(file, 'image');
        document.getElementById('userAvatar').style.backgroundImage = `url(${imageUrl})`;
        await setDoc(doc(db, "profiles", currentUser.uid), { avatarUrl: imageUrl }, { merge: true });
        alert('Avatar updated!');
      } catch (err) { alert(err.message); }
    };

    window.saveProfile = async function() {
      if (!currentUser) return;
      const username = document.getElementById('username').value.trim() || 'Anonymous';
      const bio = document.getElementById('bio').value;
      try {
        await setDoc(doc(db, "profiles", currentUser.uid), { username, bio }, { merge: true });
        alert('Profile updated!');
      } catch (err) { alert(err.message); }
    };

    window.claimOldVideos = async function() {
      if (!currentUser) return;
      const userSnap = await getDoc(doc(db, "profiles", currentUser.uid));
      const myUsername = userSnap.exists() ? (userSnap.data().username || '').toLowerCase() : '';
      
      alert('Claiming videos matching your profile username...');
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        let count = 0;
        for (const docSnap of querySnapshot.docs) {
          const data = docSnap.data();
          if ((data.creator || '').toLowerCase() === myUsername || (data.creator || '').toLowerCase() === 'thaddius') {
            await updateDoc(doc(db, "posts", docSnap.id), { creatorUid: currentUser.uid });
            count++;
          }
        }
        alert(`Claimed ${count} videos! Reloading feed...`);
        await loadFeed();
        await loadProfileData();
      } catch (err) { alert(err.message); }
    };

    window.uploadVideo = async function() {
      if (!currentUser) return;
      const fileInput = document.getElementById('videoFileInput');
      const thumbInput = document.getElementById('thumbFileInput');
      const titleInput = document.getElementById('videoTitle');
      const descInput = document.getElementById('videoDesc');

      if (!fileInput.files[0]) return alert('Select video file.');

      const userSnap = await getDoc(doc(db, "profiles", currentUser.uid));
      const creatorName = userSnap.exists() ? (userSnap.data().username || 'Anonymous') : 'Anonymous';

      alert('Publishing video...');
      try {
        const videoUrl = await uploadToCloudinary(fileInput.files[0], 'video');
        let thumbnailUrl = thumbInput.files[0] ? await uploadToCloudinary(thumbInput.files[0], 'image') : '';

        await addDoc(collection(db, "posts"), {
          title: titleInput.value.trim() || 'Untitled',
          description: descInput.value.trim() || '',
          creator: creatorName,
          creatorUid: currentUser.uid,
          videoUrl,
          thumbnailUrl,
          likes: 0,
          views: 0,
          comments: [],
          createdAt: new Date()
        });

        alert('Video live!');
        fileInput.value = ''; thumbInput.value = ''; titleInput.value = ''; descInput.value = '';
        await loadFeed();
        showPage('home');
      } catch (err) { alert(err.message); }
    };

    window.openWatchModal = async function(postId) {
      const post = cachedPosts.find(p => p.id === postId);
      if (!post) return;
      currentActivePost = post;

      document.getElementById('watchTitle').innerText = post.title || 'Untitled';
      document.getElementById('watchCreator').innerText = `@${post.creator || 'Anonymous'}`;
      document.getElementById('watchDesc').innerText = post.description || '';
      document.getElementById('watchVideoPlayer').src = post.videoUrl;

      renderComments(post.comments || []);
      renderWatchSidebar(post.id);

      showPage('watchOverlay');

      try { await updateDoc(doc(db, "posts", postId), { views: increment(1) }); } catch (err) {}
    };

    function renderComments(comments) {
      const list = document.getElementById('commentsList');
      if (!comments || !comments.length) {
        list.innerHTML = '<p style="font-size:12px; color:#aaa;">No comments yet. Be the first!</p>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="comment-item">
          <strong style="color:#a78bfa;">@${c.user}</strong>
          <p style="margin:3px 0 0 0;">${c.text}</p>
        </div>
      `).join('');
    }

    window.postComment = async function() {
      if (!currentUser || !currentActivePost) return;
      const input = document.getElementById('newCommentInput');
      const text = input.value.trim();
      if (!text) return;

      const userSnap = await getDoc(doc(db, "profiles", currentUser.uid));
      const userName = userSnap.exists() ? (userSnap.data().username || 'User') : 'User';
      const commentObj = { user: userName, text, createdAt: new Date().toISOString() };

      try {
        await updateDoc(doc(db, "posts", currentActivePost.id), {
          comments: arrayUnion(commentObj)
        });
        if (!currentActivePost.comments) currentActivePost.comments = [];
        currentActivePost.comments.push(commentObj);
        renderComments(currentActivePost.comments);
        input.value = '';
      } catch (err) { alert(err.message); }
    };

    function renderWatchSidebar(currentId) {
      const otherPosts = cachedPosts.filter(p => p.id !== currentId);
      renderFeedItems(otherPosts, 'relatedVideosContainer');
    }

    function renderFeedItems(posts, targetContainerId) {
      const container = document.getElementById(targetContainerId);
      if (!container) return;
      if (!posts || !posts.length) {
        container.innerHTML = '<p style="font-size:13px; color:#aaa;">No videos found.</p>';
        return;
      }
      container.innerHTML = '';
      posts.forEach((data) => {
        let mediaHtml = `
          <div class="thumbnail-container" onclick="openWatchModal('${data.id}')">
            ${data.thumbnailUrl ? `<img src="${data.thumbnailUrl}" class="thumbnail-img">` : `<video src="${data.videoUrl}" style="width:100%; height:100%; object-fit:cover;"></video>`}
            <div class="play-overlay">▶</div>
          </div>`;

        const post = document.createElement('div');
        post.className = 'card';
        post.innerHTML = `
          <h3 style="margin:0 0 4px 0;">${data.title || 'Untitled'}</h3>
          <span class="creator-link" onclick="openChannel('${data.creator}')">By @${data.creator || 'Anonymous'}</span>
          ${mediaHtml}
          <p style="font-size:13px; color:#a78bfa; margin-top:8px;">${data.description || ''}</p>
        `;
        container.appendChild(post);
      });
    }

    async function loadFeed() {
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        cachedPosts = [];
        querySnapshot.forEach((docSnap) => {
          cachedPosts.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderFeedItems(cachedPosts, 'feed');
      } catch (err) {}
    }

    function renderShorts() {
      const container = document.getElementById('shortsContainer');
      if (!container) return;
      if (!cachedPosts.length) {
        container.innerHTML = '<p style="text-align:center; padding-top:40px;">No videos available.</p>';
        return;
      }
      container.innerHTML = cachedPosts.map(post => `
        <div class="short-card">
          <video src="${post.videoUrl}" controls loop playsinline></video>
          <div class="short-overlay">
            <h4 style="margin:0 0 4px 0; font-size:16px;">${post.title || 'Untitled'}</h4>
            <span class="creator-link" onclick="openChannel('${post.creator}')">@${post.creator || 'Anonymous'}</span>
            <p style="font-size:12px; margin:4px 0 0 0; color:#ddd;">${post.description || ''}</p>
          </div>
          <div class="short-actions">
            <button class="short-btn" onclick="likeShort('${post.id}')">❤️</button>
            <span style="font-size:11px;">${post.likes || 0}</span>
          </div>
        </div>
      `).join('');
    }

    window.likeShort = async function(postId) {
      try {
        await updateDoc(doc(db, "posts", postId), { likes: increment(1) });
        const post = cachedPosts.find(p => p.id === postId);
        if (post) post.likes = (post.likes || 0) + 1;
        renderShorts();
      } catch (err) {}
    };

    async function loadProfileData() {
      if (!currentUser) return;
      try {
        const docSnap = await getDoc(doc(db, "profiles", currentUser.uid));
        if (docSnap.exists()) {
          const profile = docSnap.data();
          document.getElementById('username').value = profile.username || '';
          document.getElementById('bio').value = profile.bio || '';
          if (profile.avatarUrl) {
            document.getElementById('userAvatar').style.backgroundImage = `url(${profile.avatarUrl})`;
          }
        }
        const myPosts = cachedPosts.filter(p => p.creatorUid === currentUser.uid);
        renderFeedItems(myPosts, 'myUploadsContainer');
      } catch (err) {}
    }

    window.openChannel = function(creatorName) {
      document.getElementById('channelName').innerText = `@${creatorName}`;
      const channelPosts = cachedPosts.filter(p => (p.creator || '').toLowerCase() === (creatorName || '').toLowerCase());
      renderFeedItems(channelPosts, 'channelVideosContainer');
      showPage('channelOverlay');
    };
  </script>
</head>
<body>

  <header>FreedomHub V4.5</header>

  <div id="authScreen" class="page hidden">
    <div class="card">
      <h2>Sign In</h2>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <button onclick="handleEmailAuth('login')">Sign In</button>
      <button onclick="handleEmailAuth('register')" class="btn-secondary">Register</button>
      <button onclick="handleGoogleSignIn()" class="btn-google">Google Sign In</button>
    </div>
  </div>

  <div id="home" class="page hidden">
    <div id="feed"></div>
  </div>

  <div id="watchOverlay" class="page hidden">
    <button class="btn-secondary" onclick="showPage('home')" style="width:auto; padding:6px 16px; margin-bottom:15px;">← Back to Home</button>
    <div class="card" style="padding:10px;">
      <video id="watchVideoPlayer" controls autoplay style="width:100%; border-radius:8px;"></video>
      <h2 id="watchTitle" style="margin:10px 0 4px 0;">Video Title</h2>
      <span id="watchCreator" class="creator-link">@Creator</span>
      <p id="watchDesc" style="font-size:13px; color:#ccc; margin-top:8px;"></p>
    </div>

    <!-- Comments Section -->
    <div class="card">
      <h3 style="margin:0 0 10px 0; color:#a78bfa;">Comments</h3>
      <input type="text" id="newCommentInput" placeholder="Add a comment...">
      <button onclick="postComment()" style="margin-top:8px;">Post Comment</button>
      <div id="commentsList" style="margin-top:15px;"></div>
    </div>

    <!-- Suggested Videos -->
    <h3 style="color:#a78bfa; margin-top:20px;">Up Next</h3>
    <div id="relatedVideosContainer"></div>
  </div>

  <div id="shorts" class="page shorts-page hidden">
    <div id="shortsContainer"></div>
  </div>

  <div id="upload" class="page hidden">
    <div class="card">
      <h2>Upload Video</h2>
      <label style="font-size:12px; color:#a78bfa;">Video File</label>
      <input type="file" id="videoFileInput" accept="video/*">
      <label style="font-size:12px; color:#a78bfa;">Thumbnail Image</label>
      <input type="file" id="thumbFileInput" accept="image/*">
      <input t
